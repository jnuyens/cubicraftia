;
; Godot export presets — four CI targets: macOS, Windows Desktop, Linux/X11, Android
; iOS is NOT included (D-04: deferred to Phase 5; manual export via scripts/export-ios.sh on M4 MacBook)
;
; Android signing: credentials must be set via CI environment variables or the Godot editor.
; Do NOT commit release.keystore or plaintext passwords. See docs/SETUP.md.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/profanity/*.txt,assets/meshes/avatars/*/layout.json,src/bricks/manifest.json,locale/*.po"
exclude_filter="assets/meshes/*.jpg,assets/meshes/*.png,assets/meshes/*/*.jpg,assets/meshes/*/*.png,assets/meshes/*/*/*.jpg,assets/meshes/*/*/*.png,assets/meshes/*/*/*/*.jpg,assets/meshes/*/*/*/*.png"
export_path="build/macOS/Cubicraftia.dmg"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/architecture="universal"
application/bundle_identifier="org.cubicraftia.game"
codesign/enable=false
notarization/enable=false
privacy/microphone_usage_description=""
privacy/camera_usage_description=""
privacy/location_usage_description=""
privacy/address_book_usage_description=""
privacy/calendar_usage_description=""

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/profanity/*.txt,assets/meshes/avatars/*/layout.json,src/bricks/manifest.json,locale/*.po"
exclude_filter="art-*, animals*, builder-*, builder.glb, builder1-*, builder4-*, builder5-*, builder_*, bulder1-*, brick_1x1.glb, pil.png, pil-fullcolor*, food.*, food_*, ice_castle*, minifig.png, cubicraftia_wordmark.png, title_bg.png, title_character.png, title_loop.*, world_day.*, world_night.*, weat-*, bat slime ghost penguin vampire*, panda elephant orca fish jellyfish*, pig dog sheep wolf*, *.pxd, *.aup3, messages.mo, images generation.rtf, assets/meshes/*.jpg, assets/meshes/*.png, assets/meshes/*/*.jpg, assets/meshes/*/*.png, assets/meshes/*/*/*.jpg, assets/meshes/*/*/*.png, assets/meshes/*/*/*/*.jpg, assets/meshes/*/*/*/*.png"
export_path="build/Windows/Cubicraftia.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

binary_format/architecture="x86_64"
codesign/enable=false

