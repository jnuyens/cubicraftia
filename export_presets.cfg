exclude_filter="assets/meshes/*.jpg,assets/meshes/*.png,assets/meshes/*/*.jpg,assets/meshes/*/*.png,assets/meshes/*/*/*.jpg,assets/meshes/*/*/*.png,assets/meshes/*/*/*/*.jpg,assets/meshes/*/*/*/*.png"
export_path="build/Linux/Cubicraftia.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
