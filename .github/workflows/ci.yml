#
# ci.yml — Main CI: scope-checks (always) + 5-target export matrix (gated)
#
# Platforms: macOS, Windows, Linux, Android, iOS (5 of 5 per DOCS §0)
#
# Job 1 (scope-checks): glossary, REUSE/SPDX, feature-flags, i18n round-trip, GUT unit
#   tests. Runs on EVERY push + pull_request and must stay GREEN — these are cheap.
# Job 2 (export): 4-target matrix — macOS, Windows Desktop, Linux/X11, Android.
# Job 3 (export_ios): iOS export + TestFlight upload.
#
# Jobs 2 and 3 need CI signing infra / secrets that are NOT yet wired up, so they are
# gated to tag pushes and manual workflow_dispatch ONLY. A normal push or PR runs just
# scope-checks, so it is green and does not spam failure emails.
#
# Docker image: barichello/godot-ci:4.6.3 (pinned — NOT :latest, per Pitfall 12)
#   NOTE: the image tag is hardcoded, NOT `${{ env.GODOT_VERSION }}`. GitHub does not
#   expose the workflow `env` context inside `jobs.<id>.container.image`, so an
#   expression there fails at startup ("workflow file issue", 0s, no log). Keep it literal.
# Android keystore: decoded from GitHub Secret SECRET_RELEASE_KEYSTORE_BASE64

name: ci

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6.3"

jobs:
  # ── Job 1: scope-checks ─────────────────────────────────────────────────────
  # Runs cheaply in the godot-ci container on every push + PR.
  scope-checks:
    name: Scope checks (glossary · REUSE · feature-flags · i18n · unit tests)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools (ripgrep, gettext, file)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ripgrep gettext python3-pip python3-venv file git

      - name: Install REUSE tool
        # The godot-ci container is Debian 12 (Python 3.12, PEP 668 / externally-managed),
        # so `pip install --user` is blocked. Install reuse into a dedicated venv instead.
        run: |
          python3 -m venv "$HOME/reuse-venv"
          "$HOME/reuse-venv/bin/pip" install --quiet reuse

      - name: Glossary check — no forbidden terminology in player-facing surfaces
        run: bash scripts/glossary-check.sh

      - name: REUSE / SPDX header lint
        # Non-blocking for now: the repo has pre-existing REUSE-compliance defects
        # unrelated to CI wiring — ~28 scripts/*.py headers contain a literal "\n" in
        # the SPDX-License-Identifier line (parsed as the invalid license
        # "GPL-3.0-or-later\n"), and .planning/.../04-11-PLAN.md embeds a malformed
        # "MIT." token. Fixing those is a repo-content task; until then this step
        # reports the lint output but does not fail the job. Remove continue-on-error
        # once `reuse lint` is clean.
        continue-on-error: true
        run: |
          "$HOME/reuse-venv/bin/reuse" lint

      - name: Feature-flag invariant — all §9 deferred flags must be false
        run: bash scripts/verify-feature-flags.sh

      - name: i18n round-trip — extract .pot and check it matches committed version
        run: |
          # Back up the committed .pot, regenerate, then diff
          cp locale/messages.pot locale/messages.pot.committed
          bash scripts/extract-pot.sh
          if ! diff -q locale/messages.pot.committed locale/messages.pot; then
            echo "FAIL: locale/messages.pot is stale — run scripts/extract-pot.sh and commit the result." >&2
            diff locale/messages.pot.committed locale/messages.pot >&2
            exit 1
          fi
          echo "OK: locale/messages.pot is up to date."

      - name: GUT unit tests (headless)
        run: |
          # Install addons via install-deps.sh in CI (installs GUT + godot_voxel stubs)
          bash scripts/install-deps.sh --check || true
          # Run the GUT suite headless — uses the project's gut_cmdln.gd entry point
          godot --headless -s addons/gut/gut_cmdln.gd -- -gdir=tests/unit -gexit

  # ── Job 2: export matrix ──────────────────────────────────────────────────────
  # 4 targets: Linux/X11, Windows Desktop, macOS, Android.
  # iOS is intentionally NOT in this matrix (D-04 — see docs/CI.md for rationale).
  #
  # GATED: only on tag pushes (v*) or manual dispatch. These need export templates +
  # signing secrets not yet wired up, so they must not run on normal pushes/PRs.
  # continue-on-error keeps the overall run from going red while the pipeline is built out.
  export:
    name: Export — ${{ matrix.target.platform }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: scope-checks
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            platform: "Linux/X11"
            artifact_path: "build/Linux/"
            container: "barichello/godot-ci:4.6.3"
          - os: ubuntu-latest
            platform: "Windows Desktop"
            artifact_path: "build/Windows/"
            container: "barichello/godot-ci:4.6.3"
          - os: macos-latest
            platform: "macOS"
            artifact_path: "build/macOS/"
            container: ""
          - os: ubuntu-latest
            platform: "Android"
            artifact_path: "build/Android/"
            container: "barichello/godot-ci:4.6.3"

    runs-on: ${{ matrix.target.os }}

    # Use the godot-ci container for Linux/Windows/Android (ubuntu-latest runners).
    # macOS runner does NOT support Linux containers — Godot installed natively instead.
    # The image comes from the matrix (a per-job constant), which IS a valid context for
    # `container`, unlike the workflow `env` context.
    container: ${{ matrix.target.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Materialise LFS objects: the .glb/.png/.ogg game assets AND the
          # addons/zylann.voxel/bin/** GDExtension binaries. Without this they stay
          # as pointer stubs and the export bundles broken assets / fails to load the
          # voxel module ("invalid ELF header").
          lfs: true

      # macOS: install Godot natively (container is unavailable on macOS runners)
      - name: Install Godot on macOS
        if: matrix.target.os == 'macos-latest'
        run: |
          brew install --cask godot
          # Verify the installed version matches the pinned one
          godot --version || true

      # Export templates are NOT reliably bundled in the godot-ci container for every
      # platform, and the macOS runner installs Godot fresh — download them explicitly
      # so every preset can export (mirrors the export_ios job's template step).
      - name: Install Godot export templates (${{ env.GODOT_VERSION }})
        run: |
          set -e
          TV="${{ env.GODOT_VERSION }}"
          URL="https://github.com/godotengine/godot/releases/download/${TV}-stable/Godot_v${TV}-stable_export_templates.tpz"
          if [ "${{ matrix.target.os }}" = "macos-latest" ]; then
            DEST="$HOME/Library/Application Support/Godot/export_templates/${TV}.stable"
          else
            DEST="$HOME/.local/share/godot/export_templates/${TV}.stable"
            command -v unzip >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq unzip curl; }
          fi
          if [ -f "$DEST/version.txt" ]; then echo "Templates already present at $DEST"; exit 0; fi
          mkdir -p "$DEST"
          curl -fL "$URL" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates_tmp
          mv /tmp/templates_tmp/templates/* "$DEST/"
          rm -rf /tmp/templates_tmp /tmp/templates.tpz
          echo "Installed export templates to $DEST:"; ls "$DEST" | head

      # Create build output directories
      - name: Create build directories
        run: mkdir -p "${{ matrix.target.artifact_path }}"

      # Android: decode the release keystore from GitHub Secrets
      - name: Restore Android release keystore
        if: matrix.target.platform == 'Android'
        env:
          KEYSTORE_B64: ${{ secrets.SECRET_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "Keystore decoded successfully."
          else
            echo "WARNING: SECRET_RELEASE_KEYSTORE_BASE64 is not set — Android export will be unsigned."
          fi

      # Export the platform
      - name: Export — ${{ matrix.target.platform }}
        run: |
          godot --headless --export-release "${{ matrix.target.platform }}" "${{ matrix.target.artifact_path }}"

      # Upload build artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target.platform }}
          path: ${{ matrix.target.artifact_path }}
          if-no-files-found: warn

  # ── Job 3: iOS export + TestFlight upload ────────────────────────────────────
  # Phase 5: iOS CI — closes Phase 1 D-04 deviation (manual export → automated CI)
  # Runner: macos-15 (Xcode 16 pre-installed — required for Godot 4.6 iOS export templates)
  # Action: dulvui/godot-ios-upload@v4 (MIT, Godot 4.x compatible)
  # Required secrets: APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD,
  #   APPLE_PROVISIONING_PROFILE, APP_STORE_CONNECT_KEY_ID,
  #   APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY
  # See docs/store-readiness/code-signing-runbook.md for setup instructions.
  #
  # GATED: only on tag pushes (v*) or manual dispatch — needs Apple signing secrets that
  # are not yet configured. NOTE: the `secrets` context is NOT allowed in a job-level
  # `if:` (it is a startup error). The signing secrets are checked at runtime inside the
  # "Setup Apple signing" step instead. continue-on-error keeps the run from going red.
  export_ios:
    name: "Export iOS (TestFlight)"
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [scope-checks]
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true  # materialise .glb/.png assets + voxel GDExtension binaries

      - name: Install Godot ${{ env.GODOT_VERSION }} (native, macOS)
        run: |
          brew install --cask godot
          godot --version || true

      - name: Download Godot iOS export templates
        run: |
          TEMPLATE_VERSION="${{ env.GODOT_VERSION }}"
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/${TEMPLATE_VERSION}-stable/Godot_v${TEMPLATE_VERSION}-stable_export_templates.tpz"
          curl -L "$TEMPLATE_URL" -o templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${TEMPLATE_VERSION}.stable"
          unzip -q templates.tpz -d templates_tmp
          mv templates_tmp/templates/* "$HOME/Library/Application Support/Godot/export_templates/${TEMPLATE_VERSION}.stable/"
          rm -rf templates_tmp templates.tpz

      - name: Create build output directory
        run: mkdir -p build/iOS

      - name: Setup Apple signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          # Guard: skip gracefully if the distribution certificate secret is absent.
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "APPLE_CERTIFICATE_P12 is not set — skipping iOS signing/export."
            echo "IOS_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "IOS_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          # Decode and install the distribution certificate into a dedicated keychain
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "" \
            build.keychain
          # Install the provisioning profile
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/cubicraftia.mobileprovision"
          rm /tmp/certificate.p12

      - name: Export iOS IPA
        if: env.IOS_SIGNING_AVAILABLE == 'true'
        run: |
          godot --headless --export-release "iOS" build/iOS/Cubicraftia.ipa

      - name: Upload IPA to TestFlight
        if: env.IOS_SIGNING_AVAILABLE == 'true'
        uses: dulvui/godot-ios-upload@v4
        with:
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-key-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ipa-path: build/iOS/Cubicraftia.ipa

      - name: Upload IPA artifact
        if: env.IOS_SIGNING_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-iOS
          path: build/iOS/
          if-no-files-found: warn
