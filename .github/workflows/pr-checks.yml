#
# pr-checks.yml — Lightweight PR lint job
#
# Runs on pull_request events only. Executes the same scope-checks as ci.yml
# (glossary, REUSE, feature-flags, i18n round-trip, GUT unit tests) but SKIPS
# the export matrix to give a fast red/green signal on a PR.
#
# Container image is hardcoded (barichello/godot-ci:4.6.3), NOT `${{ env.GODOT_VERSION }}`:
# GitHub does not expose the workflow `env` context inside `jobs.<id>.container.image`, so
# an expression there fails at startup ("No jobs were run" / "workflow file issue", 0s, no
# log). Keep the tag literal.

name: pr-checks

on:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6.3"

jobs:
  scope-checks:
    name: PR scope checks (glossary · REUSE · feature-flags · i18n · unit tests)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools (ripgrep, gettext, file)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ripgrep gettext python3-pip python3-venv file git

      - name: Install REUSE tool
        # The godot-ci container is Debian 12 (Python 3.12, PEP 668 / externally-managed),
        # so `pip install --user` is blocked. Install reuse into a dedicated venv instead.
        run: |
          python3 -m venv "$HOME/reuse-venv"
          "$HOME/reuse-venv/bin/pip" install --quiet reuse

      - name: Glossary check — no forbidden terminology in player-facing surfaces
        run: bash scripts/glossary-check.sh

      - name: REUSE / SPDX header lint
        # Non-blocking for now: the repo has pre-existing REUSE-compliance defects
        # unrelated to CI wiring (~28 scripts/*.py headers carry a literal "\n" in the
        # SPDX-License-Identifier line, and a .planning doc embeds a malformed "MIT."
        # token). This step reports the lint output but does not fail the job. Remove
        # continue-on-error once `reuse lint` is clean.
        continue-on-error: true
        run: |
          "$HOME/reuse-venv/bin/reuse" lint

      - name: Feature-flag invariant — all §9 deferred flags must be false
        run: bash scripts/verify-feature-flags.sh

      - name: i18n round-trip — extract .pot and check it matches committed version
        run: |
          cp locale/messages.pot locale/messages.pot.committed
          bash scripts/extract-pot.sh
          if ! diff -q locale/messages.pot.committed locale/messages.pot; then
            echo "FAIL: locale/messages.pot is stale — run scripts/extract-pot.sh and commit the result." >&2
            diff locale/messages.pot.committed locale/messages.pot >&2
            exit 1
          fi
          echo "OK: locale/messages.pot is up to date."

      - name: GUT unit tests (headless)
        run: |
          bash scripts/install-deps.sh --check || true
          godot --headless -s addons/gut/gut_cmdln.gd -- -gdir=tests/unit -gexit
