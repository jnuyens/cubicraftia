# /etc/nginx/conf.d/signal.cubicraftia.com.conf  (Phase 11 DEPLOY-01)
# WSS signaling: TLS terminates here, proxies to the loopback Go signaling server.
# ADD ONLY. Do not touch other vhosts. `nginx -t` must pass before reload.
# TLS lines are added by: certbot --nginx -d signal.cubicraftia.com
server {
    listen 80;
    listen [::]:80;
    server_name signal.cubicraftia.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name signal.cubicraftia.com;

    # ssl_certificate / ssl_certificate_key added by certbot

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived signaling WebSockets
        proxy_send_timeout 3600s;
    }
}
