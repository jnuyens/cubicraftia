# /etc/nginx/conf.d/supabase.cubicraftia.com.conf  (Phase 11 DEPLOY-01/03)
# Supabase API: TLS terminates here, proxies to the Kong gateway (loopback, docker).
# ADD ONLY. `nginx -t` must pass before reload. TLS via certbot --nginx -d supabase.cubicraftia.com
server {
    listen 80;
    listen [::]:80;
    server_name supabase.cubicraftia.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name supabase.cubicraftia.com;

    # ssl_certificate / ssl_certificate_key added by certbot
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;   # Supabase Kong
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
